name: Windows
on:
  push:
    branches: [main, windows-standalone]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      - name: Test
        run: cargo test --release --locked --target x86_64-pc-windows-msvc
      - name: Build portable download
        run: ./build-windows.ps1
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'bluetunes').version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match Cargo.toml version.' }
      - uses: actions/upload-artifact@v4
        with:
          name: BlueTunes-windows-x64
          path: dist/BlueTunes-*.zip*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BlueTunes-windows-x64
          path: dist
      - name: Create draft release with Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "BlueTunes $RELEASE_TAG" \
            --notes "Standalone Windows 11 x64 app. Download the ZIP, extract it, and run BlueTunes.exe. No Rust installation required. This build is unsigned."
